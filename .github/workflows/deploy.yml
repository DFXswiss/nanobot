name: Deploy NanoBot

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "workspace/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: dfxswiss/nanobot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trigger deploy-infrastructure.yml im DFXswiss/server. Der Runner auf
      # dfx01 pullt :latest (pull_policy: always) und rollt alle
      # nanobot-Instanzen aus.
      - name: Trigger dfx01 redeploy
        env:
          GH_TOKEN: ${{ secrets.SERVER_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/DFXswiss/server/dispatches \
            -f event_type=dfx01-stack-redeploy \
            -f "client_payload[stack]=nanobot" \
            -f "client_payload[image_sha]=${{ github.sha }}"
