name: Build and publish image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "workspace/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOCKER_IMAGE: dfxswiss/nanobot

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify image publish endpoint
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          TAG: latest
        run: |
          set -euo pipefail
          digest_re='^sha256:[0-9a-f]{64}$'
          if [[ ! "${IMAGE_DIGEST}" =~ ${digest_re} ]]; then
            echo "::error::image digest is missing or malformed"
            exit 1
          fi
          audience='https://image-published.dfxserve.com/v1/image-published'
          oidc_token="$(curl --silent --fail \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | jq -er '.value' 2>/dev/null)" || {
            echo "::error::failed to request identity token"
            exit 1
          }
          if [ -z "${oidc_token}" ]; then
            echo "::error::failed to request identity token"
            exit 1
          fi
          body="$(jq -nc --arg image "${DOCKER_IMAGE}" --arg tag "${TAG}" --arg digest "${IMAGE_DIGEST}" '{image:$image,tag:$tag,digest:$digest}')"
          http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${body}" \
            "${audience}")" || {
            echo "::error::image publish request failed"
            exit 1
          }
          case "${http_code}" in
            2[0-9][0-9]) ;;
            *)
              echo "::error::image publish request failed"
              exit 1
              ;;
          esac

      - name: Notify downstream repo
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
        run: |
          if [ -z "$DISPATCH_REPO" ] || [ -z "$GH_TOKEN" ]; then
            echo "::warning::DISPATCH_REPO or DISPATCH_TOKEN not configured — skipping"
            exit 0
          fi
          gh api "repos/$DISPATCH_REPO/dispatches" \
            -f event_type=image-published \
            -f "client_payload[image]=${{ env.DOCKER_IMAGE }}" \
            -f "client_payload[sha]=${{ github.sha }}"
